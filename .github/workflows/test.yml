name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # main embeds frontend/dist, which Wails builds and git ignores. The
      # tests don't need the real frontend, only something to embed.
      - name: Create placeholder frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Vet (Linux)
        run: go vet ./...

      - name: Vet (Windows)
        run: GOOS=windows go vet ./...

      - name: Test
        run: go test -race ./...
